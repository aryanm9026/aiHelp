<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Helper</title>
    <style>
        body {
            width: 300px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
        .api-section {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #000000;
            border-radius: 5px;
        }
        #api-key-input {
            width: 100%;
            padding: 5px;
            margin-bottom: 5px;
        }
        button {
            width: 100%;
            padding: 8px;
            background-color: #4CAF50;
            color: rgb(0, 0, 0);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #status {
            margin-top: 5px;
            color: green;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="api-section">
        <input type="password" id="api-key-input" placeholder="Enter OpenAI API Key">
        <button id="save-api-key">Save API Key</button>
        <div id="status"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
