<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Helper</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 300px;
        }
        #response-container {
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #000000;
            margin-bottom: 10px;
        }
        textarea {
            width: calc(100% - 20px);
            height: 50px;
            margin: 10px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="response-container"></div>
    <textarea id="chat-input" placeholder="Type your query here..."></textarea>
    <button id="send-button">Send</button>
    <script src="popup.js"></script>
</body>
</html>
